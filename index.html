  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard" aria-label="DP-600 Study Lab home">
        <span class="brand-mark" aria-hidden="true">D6</span>
        <span class="brand-text">
          <strong>Study Lab</strong>
          <span>DP-600 · Fabric Analytics</span>
        </span>
      </a>

      <nav class="nav" aria-label="Primary">
        <p class="nav-label">Study</p>
        <a class="nav-item" href="#/dashboard" data-nav="dashboard"><svg class="icon"><use href="#i-home"/></svg><span>Dashboard</span></a>
        <a class="nav-item" href="#/practice" data-nav="practice"><svg class="icon"><use href="#i-book"/></svg><span>Practice</span><span class="nav-count" id="nav-practice-count"></span></a>
        <a class="nav-item" href="#/exam" data-nav="exam"><svg class="icon"><use href="#i-timer"/></svg><span>Exam</span><span class="nav-dot" id="nav-exam-dot" hidden></span></a>
        <a class="nav-item" href="#/topics" data-nav="topics"><svg class="icon"><use href="#i-layers"/></svg><span>Topics &amp; notes</span></a>

        <p class="nav-label">Improve</p>
        <a class="nav-item" href="#/review" data-nav="review"><svg class="icon"><use href="#i-rotate"/></svg><span>Review</span><span class="nav-count" id="nav-review-count"></span></a>
        <a class="nav-item" href="#/library" data-nav="library"><svg class="icon"><use href="#i-search"/></svg><span>Question library</span></a>
        <a class="nav-item" href="#/progress" data-nav="progress"><svg class="icon"><use href="#i-chart"/></svg><span>Progress</span></a>

        <p class="nav-label">Reference</p>
        <a class="nav-item" href="#/about" data-nav="about"><svg class="icon"><use href="#i-info"/></svg><span>Sources &amp; method</span></a>
      </nav>

      <div class="sidebar-foot">
        <div class="confidence-mini" id="confidence-mini"></div>
        <button class="sidebar-action" type="button" data-action="open-settings">
          <svg class="icon"><use href="#i-settings"/></svg><span>Settings</span>
        </button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" type="button" data-action="toggle-sidebar" aria-label="Open navigation" aria-expanded="false">
            <svg class="icon"><use href="#i-menu"/></svg>
          </button>
          <div class="topbar-title">
            <p class="eyebrow" id="topbar-eyebrow">DP-600 Study Lab</p>
            <h1 id="topbar-title">Dashboard</h1>
          </div>
        </div>
        <div class="topbar-right">
          <div class="exam-clock" id="exam-clock" hidden>
            <svg class="icon"><use href="#i-clock"/></svg>
            <span id="exam-clock-text">00:00</span>
          </div>
          <button class="icon-btn" type="button" data-action="open-search" aria-label="Search questions" title="Search (press /)">
            <svg class="icon"><use href="#i-search"/></svg>
          </button>
          <button class="icon-btn" type="button" data-action="toggle-theme" aria-label="Toggle colour theme" title="Toggle theme">
            <svg class="icon theme-icon-dark"><use href="#i-sun"/></svg>
            <svg class="icon theme-icon-light"><use href="#i-moon"/></svg>
          </button>
          <button class="icon-btn desktop-only" type="button" data-action="open-settings" aria-label="Settings" title="Settings">
            <svg class="icon"><use href="#i-settings"/></svg>
          </button>
        </div>
      </header>

      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="Mobile">
    <a href="#/dashboard" data-nav="dashboard"><svg class="icon"><use href="#i-home"/></svg><span>Home</span></a>

    <button type="button" data-action="toggle-more" aria-expanded="false"><svg class="icon"><use href="#i-grid"/></svg><span>More</span></button>
  </nav>

    <div class="more-sheet-backdrop" data-action="close-more"></div>
    <div class="more-sheet-panel" role="dialog" aria-modal="true" aria-label="More navigation">
      <div class="more-sheet-head"><strong>More</strong><button class="icon-btn" type="button" data-action="close-more" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button></div>
      <div class="more-grid">
        <a href="#/topics" data-nav="topics"><svg class="icon"><use href="#i-layers"/></svg><span>Topics &amp; notes</span></a>
        <a href="#/library" data-nav="library"><svg class="icon"><use href="#i-search"/></svg><span>Library</span></a>
        <a href="#/progress" data-nav="progress"><svg class="icon"><use href="#i-chart"/></svg><span>Progress</span></a>
        <a href="#/about" data-nav="about"><svg class="icon"><use href="#i-info"/></svg><span>Sources</span></a>
        <button type="button" data-action="open-settings"><svg class="icon"><use href="#i-settings"/></svg><span>Settings</span></button>
        <button type="button" data-action="toggle-theme"><svg class="icon"><use href="#i-sun"/></svg><span>Theme</span></button>
      </div>
    </div>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">This study lab needs JavaScript enabled. It runs entirely on your device; no data is uploaded.</div>
